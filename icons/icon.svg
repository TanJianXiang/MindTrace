<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 心形图标 -->
  <path d="M256 400 C180 320, 120 260, 120 200 C120 150, 160 110, 200 110 C230 110, 256 130, 256 130 C256 130, 282 110, 312 110 C352 110, 392 150, 392 200 C392 260, 332 320, 256 400 Z" fill="white"/>
  
  <!-- AI对话气泡 -->
  <circle cx="160" cy="350" r="25" fill="white" opacity="0.9"/>
  <circle cx="200" cy="370" r="20" fill="white" opacity="0.7"/>
  <circle cx="230" cy="385" r="15" fill="white" opacity="0.5"/>
</svg>
